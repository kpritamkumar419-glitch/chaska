function LGN(){return`<div class="lgn"><div class="lc"><div style="font-size:54px">👨‍🍳</div><h2>Chaska Owner</h2><p>${lg.s?'4-digit OTP daalein (+91 '+esc(lg.p)+')':'Owner ka registered mobile number daalein'}</p>${lg.s?`<input id="lo" class="big" maxlength="4" inputmode="numeric" placeholder="••••" autocomplete="one-time-code"><button class="btn g" style="width:100%" onclick="VO()">Verify &amp; Login</button>${lg.demo?`<p><small>Demo OTP: ${esc(lg.demo)}</small></p>`:''}<a onclick="lg.s=0;R()">Number badlein</a>`:`<div class="ph"><span>+91</span><input id="lp" class="big" maxlength="10" inputmode="numeric" autocomplete="tel" placeholder="10-digit number"></div><button class="btn g" style="width:100%" onclick="GO()">Get OTP</button>`}</div></div>`} 
function syncOwnerPhone(){const el=$('#lp');if(el){lg.p=el.value.replace(/\D/g,'').slice(0,10);el.value=lg.p;try{sessionStorage.setItem('chaska_owner_phone',lg.p)}catch(e){}}}

async function GO(){syncOwnerPhone();try{const r=await api('POST','/auth/otp',{phone:lg.p,role:'owner'});lg.p=lg.p.trim();lg.s=1;lg.demo=r.demo_otp||'';R()}catch(e){alert(e.message)}}
async function VO(){try{const r=await api('POST','/auth/verify',{phone:lg.p,role:'owner',otp:$('#lo').value});tok=r.token;localStorage.setItem('ck_owner',tok);lg={p:'',s:0,demo:''};start()}catch(e){alert(e.message)}}
function LO(){tok='';localStorage.removeItem('ck_owner');if(es)es.close();R()}
async function load(force){if(!tok)return;try{const[d,m]=await Promise.all([api('GET','/owner/orders',null,tok),api('GET','/menu')]);D=d;M=m}catch(e){if(e.status==401)LO();return}
 const ids=D.orders.map(o=>o.id);if(known&&ids.some(i=>!known.includes(i))){bell();toast('🔔 Naya order aaya!')}known=ids;if(force||!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))R()}
function start(){load(true);if(es)es.close();es=new EventSource('/api/stream?token='+encodeURIComponent(tok));es.onmessage=()=>load()}
const go=async(fn,msg)=>{try{await fn();if(msg)toast(msg)}catch(e){alert(e.message)}await load(true)};
const N=id=>go(()=>api('POST',`/owner/orders/${id}/status`,{},tok)),X=id=>confirm('Order cancel karein?')&&go(()=>api('POST',`/owner/orders/${id}/status`,{cancel:true},tok)),
SO=(id,off)=>go(()=>api('PATCH','/owner/products/'+id,{off},tok)),DP=id=>go(()=>api('DELETE','/owner/products/'+id,null,tok)),PS=(f,id)=>IMG(f.files[0],400,d=>go(()=>api('PATCH','/owner/products/'+id,{img:d},tok),'Photo lag gayi ✅')),
AX=()=>go(async()=>{await api('POST','/owner/products',{cat:dr.pc||M.cats[0].name,name:dr.pn||'',price:+dr.pp,img:dr.pi||''},tok);dr.pn=dr.pp=dr.pi=''},'Product add ho gaya ✅'),
AB=()=>go(async()=>{if(!dr.bi)throw Error('Pehle photo chunein');await api('POST','/owner/banners',{title:dr.bt||'',sub:dr.bs||'',img:dr.bi},tok);dr.bt=dr.bs=dr.bi=''},'Banner add ho gaya ✅'),DB=id=>go(()=>api('DELETE','/owner/banners/'+id,null,tok)),
AP=()=>go(async()=>{await api('POST','/owner/partners',{name:$('#pn').value,phone:$('#pp').value},tok)},'Partner add ho gaya ✅'),RS=id=>go(()=>api('POST',`/owner/orders/${id}/resend`,{},tok),'Riders ko dobara bheja 🔁'),DPt=id=>confirm('Partner hataayein?')&&go(()=>api('DELETE','/owner/partners/'+id,null,tok));
const oc=o=>`<div class="box"><b>${o.id}</b> <span class="tag">${o.cancelled?'Cancelled':ST[o.status]}</span> ₹${o.total} · ${esc(o.pay)}<br>${esc(o.name)} · ${esc(o.phone)}<br>${esc(o.addr)}<br>${o.items.map(i=>esc(i.n)+'×'+i.q).join(', ')}<br>${o.cancelled||o.status>3?'':o.status<2?`<button class="btn g" onclick="N('${o.id}')">→ ${ST[o.status+1]}</button> <button class="btn s" onclick="X('${o.id}')">Cancel</button>${o.rider_name?' 🛵 '+esc(o.rider_name):` <button class="btn s" onclick="RS('${o.id}')">🔁 Riders ko dobara bhejein</button>`}`:o.rider_name?'🛵 '+esc(o.rider_name):`<button class="btn s" onclick="RS('${o.id}')">🔁 Riders ko dobara bhejein</button>`}</div>`;
const box=(t,h)=>`<div class="box"><h3 style="margin-top:0">${t}</h3>${h}</div>`,pv=k=>dr[k]?`<img src="${esc(dr[k])}" style="height:60px;border-radius:8px;margin-bottom:6px"><br>`:'';
function R(){const a=$('#app');if(!tok){a.innerHTML=LGN();const el=$('#lp');if(el){el.value=lg.p;el.addEventListener('input',syncOwnerPhone);el.addEventListener('change',syncOwnerPhone);}return}
 const dn=D.orders.filter(o=>o.status==4&&!o.cancelled),pend=D.orders.filter(o=>o.status<4&&!o.cancelled),td=D.orders.filter(o=>new Date(o.created).toDateString()==new Date().toDateString()).length,
 tabs=[['ov','📊','Home'],['or','🧾','Orders'],['mn','🍽️','Menu'],['bn','🖼️','Banners'],['rd','🛵','Riders'],['hs','📜','History']];let c='';
 if(ot=='ov')c=`<div class="kp">${[['Aaj ke orders',td],['Pending',pend.length],['Delivered revenue','₹'+dn.reduce((s,o)=>s+o.total,0)],['Riders online',D.partners.filter(p=>p.online).length+'/'+D.partners.length],['Menu items',M.products.length],['Messages',D.msgs.length]].map(k=>`<div><small>${k[0]}</small><b>${k[1]}</b></div>`).join('')}</div><h3>Recent orders</h3>${D.orders.slice(0,4).map(oc).join('')||'<div class="box">Abhi koi order nahi</div>'}`;
 else if(ot=='or')c=`<h3>Live Orders</h3>${pend.map(oc).join('')||'<div class="box">Koi live order nahi</div>'}`;
 else if(ot=='mn')c=box('➕ Add New Product',`<input placeholder="Product name" value="${esc(dr.pn||'')}" oninput="dr.pn=this.value"><input placeholder="Price ₹" inputmode="numeric" value="${esc(dr.pp||'')}" oninput="dr.pp=this.value"><select onchange="dr.pc=this.value">${M.cats.map(c=>`<option ${dr.pc==c.name?'selected':''}>${esc(c.name)}</option>`).join('')}</select>${pv('pi')}<input type="file" accept="image/*" onchange="IMG(this.files[0],400,d=>{dr.pi=d;R()})"><button class="btn" onclick="AX()">+ Add product</button>`)+box('📦 Menu &amp; Stock (ON/OFF)',M.products.map(p=>`<div style="display:flex;gap:8px;align-items:center;padding:5px 0">${p.img?`<img src="${esc(p.img)}" style="width:38px;height:38px;object-fit:cover;border-radius:8px">`:`<span style="font-size:26px">${(M.cats.find(c=>c.name==p.cat)||{}).emoji||''}</span>`}<span style="flex:1">${esc(p.name)} · ₹${p.price}</span><input type="file" id="f${p.id}" accept="image/*" hidden onchange="PS(this,${p.id})"><button class="btn s" onclick="$('#f${p.id}').click()">📷</button><input type="checkbox" style="width:auto;margin:0" ${p.off?'':'checked'} onchange="SO(${p.id},!this.checked)"><button class="btn s" onclick="DP(${p.id})" title="Sirf apne jode hue products delete hote hain">🗑</button></div>`).join(''));
 else if(ot=='bn')c=box('🖼️ Top Banner / Offers',`<input placeholder="Offer title e.g. 50% OFF on Biryani" value="${esc(dr.bt||'')}" oninput="dr.bt=this.value"><input placeholder="Sub text" value="${esc(dr.bs||'')}" oninput="dr.bs=this.value">${pv('bi')}<input type="file" accept="image/*" onchange="IMG(this.files[0],900,d=>{dr.bi=d;R()})"><button class="btn" onclick="AB()">+ Add banner</button>`)+box('Live banners',M.banners.map(b=>`<div style="padding:4px 0">${esc(b.title)} <button class="btn s" onclick="DB(${b.id})">🗑</button></div>`).join('')||'Sirf default banner chal raha hai');
 else if(ot=='rd')c=box('🛵 Delivery Partners',D.partners.map(p=>{const d=D.orders.filter(o=>o.rider==p.id&&o.status==4);return`<div style="padding:4px 0">${p.online?'🟢':'⚫'} <b>${esc(p.name)}</b> · ${esc(p.phone)} · ${d.length} deliveries · ₹${d.reduce((s,o)=>s+o.earn,0)} <button class="btn s" onclick="DPt(${p.id})">🗑</button></div>`}).join(''))+box('➕ Add Partner (wo isi number se login karega)',`<input id="pn" placeholder="Partner name"><input id="pp" placeholder="10-digit mobile" inputmode="numeric" maxlength="10"><button class="btn" onclick="AP()">+ Add partner</button>`);
 else c=box('🧾 Order &amp; Payment History',`<div style="overflow-x:auto"><table><tr><th>ID</th><th>Date</th><th>Customer</th><th>₹</th><th>Pay</th><th>Status</th><th>Rider</th></tr>${D.orders.map(o=>`<tr><td>${o.id}</td><td>${new Date(o.created).toLocaleDateString()}</td><td>${esc(o.name)}</td><td>${o.total}</td><td>${esc(o.pay=='UPI'?'UPI':'COD')}</td><td>${o.cancelled?'Cancelled':ST[o.status]}</td><td>${esc(o.rider_name||'-')}</td></tr>`).join('')}</table></div>`)+box('✉️ Contact Messages',D.msgs.map(m=>`<div>${esc(m.name)} (${esc(m.phone)}): ${esc(m.msg)}</div>`).join('')||'None');
 a.innerHTML=`<div class="bar"><span style="flex:1">👨‍🍳 Chaska Owner</span><a onclick="mockDemoOrder();load(true)">🧪 Demo order</a><a onclick="LO()">Logout</a></div><div class="w" style="padding-bottom:90px">${c}</div><div class="bnav">${tabs.map(t=>`<button class="${ot==t[0]?'on':''}" onclick="ot='${t[0]}';R()"><span>${t[1]}</span>${t[2]}${t[0]=='or'&&pend.length?' ('+pend.length+')':''}</button>`).join('')}</div>`}
setInterval(load,6000);if(tok)start();else R();
</script></body></html>
