<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><title>Chaska Restaurant – Order Online</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="stylesheet" href="/common.css">
<style>
header{position:sticky;top:0;z-index:20;padding:12px 14px;background:var(--ac);color:#2b1a0e;font-weight:800;font-size:20px}
.hero{perspective:900px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:20px 10px;background:radial-gradient(circle at 80% 30%,#ffd75e55,transparent 60%)}
.hero h1{font-size:clamp(26px,6vw,44px);margin:0 0 8px}.hero p{color:var(--mut);margin:0 0 12px}
.cubew{width:120px;height:120px;margin:30px 50px;perspective:600px}.cube{width:120px;height:120px;position:relative;transform-style:preserve-3d;animation:sp 14s linear infinite}
.cube div{position:absolute;width:120px;height:120px;display:flex;align-items:center;justify-content:center;font-size:56px;background:var(--card);border:2px solid var(--ac);border-radius:14px}
.cube div:nth-child(1){transform:translateZ(60px)}.cube div:nth-child(2){transform:rotateY(90deg) translateZ(60px)}.cube div:nth-child(3){transform:rotateY(180deg) translateZ(60px)}.cube div:nth-child(4){transform:rotateY(-90deg) translateZ(60px)}.cube div:nth-child(5){transform:rotateX(90deg) translateZ(60px)}.cube div:nth-child(6){transform:rotateX(-90deg) translateZ(60px)}
@keyframes sp{to{transform:rotateX(360deg) rotateY(360deg)}}
.sl{position:relative;height:200px;border-radius:16px;overflow:hidden;margin:10px 0;box-shadow:0 6px 16px #0004}.sl>div{position:absolute;inset:0;opacity:0;transition:opacity .8s;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;font-size:22px;font-weight:800;color:#fff;text-shadow:0 2px 6px #000}.sl>div small{font-size:14px;font-weight:500}.sl>div.on{opacity:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0;position:sticky;top:46px;background:var(--bg);z-index:5}.chip{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:20px;padding:8px 14px}.chip.on{background:var(--ac2);color:#fff;border-color:var(--ac2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;perspective:1000px;margin:10px 0 24px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;transition:transform .15s;transform-style:preserve-3d;box-shadow:0 4px 10px #0002}.card .em{font-size:44px;transform:translateZ(30px);display:block;text-align:center}.card h4{margin:6px 0 2px}.card .pr{font-weight:800;color:var(--ac2)}.card.off{opacity:.45}
.pi{width:100%;height:110px;object-fit:cover;border-radius:10px;transform:translateZ(30px);display:block}
.q{display:flex;align-items:center;gap:8px;margin-top:8px}.q button{width:30px;height:30px;border-radius:50%;border:0;background:var(--ac);font-weight:800}
.cartb{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ac2);color:#fff;border:0;border-radius:30px;padding:14px 20px;font-weight:700;box-shadow:0 6px 16px #0006}
footer{padding:20px 14px 90px;text-align:center;color:var(--mut);font-size:14px}footer a{color:var(--ac2);cursor:pointer;margin:0 8px}
</style></head><body>
<header>🍛 Chaska Restaurant</header>
<div class="w" id="app"></div>
<footer>📍 Yadopur Rd, near Moniya Chowk, Indian Overseas Bank compound, Jalpurwan, Haziapur, Gopalganj, Bihar 841428<br>📞 097716 50477<br>
<a onclick="L('privacy')">Privacy Policy</a><a onclick="L('terms')">Terms</a><a onclick="L('refund')">Refund &amp; Cancellation</a><a onclick="L('fssai')">Food Safety</a></footer>
<button class="cartb" id="cb" onclick="CK()"></button>
<div class="modal" id="mod" onclick="if(event.target==this)C()"><div class="mb" id="mb"></div></div>
<script src="/common.js"></script>
<script>
let M={cats:[],products:[],banners:[]},cart={},cat=0,si=0,loc=null,tr={},my=[];
try{my=JSON.parse(localStorage.getItem('ck_my')||'[]')}catch(x){}
const P=id=>M.products.find(p=>p.id==id),tot=()=>Object.entries(cart).reduce((a,[k,q])=>a+(P(k)?.price||0)*q,0),cnt=()=>Object.values(cart).reduce((a,b)=>a+b,0);
async function load(){try{M=await api('GET','/menu')}catch(x){$('#app').innerHTML='<div class="box">Server se connect nahi ho paaya. Thodi der baad try karein.</div>';return}draw()}
function draw(){$('#app').innerHTML=`<div class="sl" id="sl"></div><div class="hero"><div style="flex:1;min-width:240px"><h1>चस्का रेस्टोरेंट 🍛</h1><p>Biryani, Tandoori, Rolls, Burger &amp; more – seedha ghar tak.</p><button class="btn" onclick="$('#menu').scrollIntoView({behavior:'smooth'})">Order Now</button></div><div class="cubew"><div class="cube"><div>🍛</div><div>🍗</div><div>🌯</div><div>🍔</div><div>🍢</div><div>🥤</div></div></div></div>
<h2 id="menu">Menu</h2><div class="chips" id="chips"></div><div class="grid" id="grid"></div><h2>My Orders &amp; Live Tracking</h2><div id="trk"></div>
<h2>Contact Us</h2><div class="box two"><div>📞 <b>097716 50477</b><br>📍 Yadopur Rd, Jalpurwan, Haziapur, Gopalganj, Bihar 841428<br>🕘 Opens 9:30 am</div><div><input id="cn" placeholder="Your name"><input id="cp" placeholder="Phone"><textarea id="cm" placeholder="Message"></textarea><button class="btn" onclick="CM()">Send message</button></div></div>`;slides();chips();grid();cb();trk()}
function slides(){const l=M.banners.length?M.banners:[{title:'🍛 Chaska Restaurant – Biryani, Tandoori & more',g:'#c0392b,#e8a800'},{title:'🌯 Naya! Rolls ab menu me',g:'#2e7d32,#e8a800'},{title:'🛵 Ghar baithe order karein',g:'#6a1b9a,#e8a800'}];$('#sl').innerHTML=l.map((b,i)=>`<div class="${i==si%l.length?'on':''}" style="background:${b.img?`url('${esc(b.img)}') center/cover`:`linear-gradient(135deg,${b.g})`}">${esc(b.title)}${b.sub?`<small>${esc(b.sub)}</small>`:''}</div>`).join('')}
setInterval(()=>{const d=document.querySelectorAll('#sl>div');if(d.length){si=(si+1)%d.length;d.forEach((x,i)=>x.classList.toggle('on',i==si))}},3500);
const EM={};const em=n=>(M.cats.find(c=>c.name==n)||{}).emoji||'🍽️';
function chips(){$('#chips').innerHTML=M.cats.map((c,i)=>`<button class="chip ${i==cat?'on':''}" onclick="cat=${i};chips();grid()">${c.emoji} ${esc(c.name)}</button>`).join('')}
function grid(){const c=M.cats[cat];if(!c)return;$('#grid').innerHTML=M.products.filter(p=>p.cat==c.name).map(p=>{const q=cart[p.id]||0;return`<div class="card ${p.off?'off':''}" onmousemove="T(event,this)" onmouseleave="this.style.transform=''">${p.img?`<img class="pi" src="${esc(p.img)}">`:`<span class="em">${c.emoji}</span>`}<h4>${esc(p.name)}</h4><div class="pr">₹${p.price}</div>${p.off?'<span class="tag">Out of stock</span>':q?`<div class="q"><button onclick="A(${p.id},-1)">−</button><b>${q}</b><button onclick="A(${p.id},1)">+</button></div>`:`<button class="btn" style="margin-top:8px" onclick="A(${p.id},1)">Add to cart</button>`}</div>`}).join('')}
function T(ev,el){const r=el.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width-.5,y=(ev.clientY-r.top)/r.height-.5;el.style.transform=`rotateY(${x*16}deg) rotateX(${-y*16}deg) translateZ(10px)`}
function cb(){$('#cb').textContent=`🛒 Cart (${cnt()}) · ₹${tot()}`}
function A(i,d){cart[i]=Math.max(0,(cart[i]||0)+d);if(!cart[i])delete cart[i];grid();cb()}
const M_=h=>{$('#mb').innerHTML=h;$('#mod').classList.add('show')},C=()=>$('#mod').classList.remove('show');
function CK(){if(!cnt())return M_('<h3>Cart khali hai</h3><button class="btn" onclick="C()">OK</button>');
 M_(`<h3>🛒 Your Cart</h3>${Object.entries(cart).map(([k,q])=>`<div>${esc(P(k).name)} × ${q} — ₹${P(k).price*q}</div>`).join('')}<h3>Total ₹${tot()}</h3><input id="on" placeholder="Name"><input id="op" placeholder="Phone (10 digit)" inputmode="numeric" maxlength="10"><textarea id="oa" placeholder="Full delivery address"></textarea><button class="btn s" onclick="LOC()" id="ls">📍 Meri location add karein (sahi doori ke liye)</button><select id="oy"><option value="Cash on Delivery">Cash on Delivery</option><option value="UPI">UPI (pay to 097716 50477)</option></select><button class="btn g" onclick="PO()">Place Order</button> <button class="btn s" onclick="C()">Close</button>`)}
function LOC(){navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{loc={lat:p.coords.latitude,lng:p.coords.longitude};$('#ls').textContent='📍 Location added ✓'},()=>toast('Location permission allow karein')):toast('Location supported nahi')}
async function PO(){const n=$('#on').value.trim(),p=$('#op').value.trim(),a=$('#oa').value.trim();if(!n||!/^[6-9]\d{9}$/.test(p)||a.length<8)return alert('Name, sahi 10 digit phone aur poora address bharein');
 try{const r=await api('POST','/orders',{name:n,phone:p,addr:a,pay:$('#oy').value,items:Object.entries(cart).map(([id,q])=>({id:+id,q})),...(loc||{})});my.unshift({id:r.id,phone:p});try{localStorage.setItem('ck_my',JSON.stringify(my))}catch(x){}cart={};loc=null;grid();cb();M_(`<h3>✅ Order placed!</h3>Order ID: <b>${r.id}</b> · ₹${r.total}<br>Neeche "My Orders" me live track karein.<br><br><button class="btn" onclick="C()">OK</button>`);pollTrack()}catch(e){alert(e.message)}}
async function CM(){if(!$('#cm').value.trim())return;try{await api('POST','/contact',{name:$('#cn').value||'Guest',phone:$('#cp').value,msg:$('#cm').value});toast('Message bhej diya ✅');$('#cm').value=''}catch(e){alert(e.message)}}
async function pollTrack(){for(const m of my.slice(0,8)){const o=tr[m.id];if(o&&(o.status==4||o.cancelled))continue;try{tr[m.id]=await api('GET',`/track/${m.id}?phone=${m.phone}`)}catch(x){}}trk()}
function trk(){const t=$('#trk');if(!t)return;const os=my.map(m=>tr[m.id]).filter(Boolean);t.innerHTML=os.length?os.map(o=>{const r=o.rider,rp=r&&r.lat!=null?{lat:r.lat,lng:r.lng}:null,left=rp&&o.dest?km(rp.lat,rp.lng,o.dest.lat,o.dest.lng):null;return`<div class="box"><b>${o.id}</b> <span class="tag">${o.cancelled?'Cancelled':ST[o.status]}</span> · ₹${o.total}<br>${o.items.map(i=>esc(i.n)+'×'+i.q).join(', ')}${o.cancelled?'':`<div class="st">${ST.map((s,i)=>`<i class="${i<=o.status?'d':''}"></i>`).join('')}</div>`}${r&&!o.cancelled?`🛵 ${esc(r.name)} · <a href="tel:${esc(r.phone)}">📞 Call</a>`:''}${o.status==3?mapSvg(o.restaurant,o.dest,rp)+(left!=null?`<small>📡 Rider live · ~${left} km door tak</small>`:'<small>📡 Rider raste me hai</small>'):''}</div>`}).join(''):'<div class="box">Abhi koi order nahi. Menu se order karein 👆</div>'}
const LG={privacy:['Privacy Policy','Hum aapka naam, phone aur address sirf order deliver karne ke liye lete hain. Data kisi ko bechte nahi. Data hatane ki request 097716 50477 par karein.'],terms:['Terms of Service','Order karke aap sahi jaankari dene par sahmat hain. Prices aur availability badal sakti hain. Delivery time estimate hota hai.'],refund:['Refund & Cancellation','Order "Preparing" se pehle cancel ho sakta hai. Galat/kharab item par 24 ghante me shikayat karein – replacement ya refund milega.'],fssai:['Food Safety','FSSAI license number: [OWNER: apna number daalein]. Khana taza aur hygiene ke saath banaya jata hai.']};
function L(k){M_(`<h3>${LG[k][0]}</h3><p>${LG[k][1]}</p><small>Template – vakil/CA se verify karwa lein.</small><br><br><button class="btn" onclick="C()">Close</button>`)}
load();pollTrack();setInterval(pollTrack,4000);setInterval(async()=>{try{M=await api('GET','/menu');chips();grid();slides()}catch(x){}},60000);
</script></body></html>
