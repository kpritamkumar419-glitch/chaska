<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Chaska Delivery Partner</title><style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:system-ui}.app{max-width:480px;margin:auto;padding:14px}.box{background:#1e1e1e;border:1px solid #333;border-radius:15px;padding:14px;margin:10px 0}.top{display:flex;gap:10px;align-items:center}.grow{flex:1}.tg{width:54px;height:30px;background:#555;border-radius:20px}.tg i{display:block;width:24px;height:24px;background:#fff;border-radius:50%;margin:3px}.on{background:#2e7d32}.on i{margin-left:27px}.btn{border:0;border-radius:10px;padding:10px 14px;background:#c0392b;color:#fff;font-weight:800}.g{background:#2e7d32}.tag{background:#e8a800;color:#000;border-radius:12px;padding:3px 8px;font-size:12px}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:#151515}.card{background:#1e1e1e;border:1px solid #333;border-radius:22px;padding:25px;max-width:380px;width:100%;text-align:center}input{width:100%;padding:11px;margin:5px 0 9px;background:#111;color:#fff;border:1px solid #444;border-radius:8px}.big{text-align:center;font-size:22px}.sheet{position:fixed;inset:0;background:#000c;z-index:50;display:flex;align-items:flex-end}.sheet>div{background:#1e1e1e;width:100%;max-width:480px;margin:auto;border-radius:24px 24px 0 0;padding:18px}.sw{height:58px;background:#2e7d32;border-radius:30px;display:flex;align-items:center;justify-content:center;position:relative;touch-action:none}.sw b{position:absolute;left:4px;width:50px;height:50px;background:#fff;color:#2e7d32;border-radius:50%;display:grid;place-items:center;font-size:28px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:20px;font-weight:700}.map{height:150px;background:#26352b;border-radius:14px;margin:10px 0}.map svg{width:100%;height:100%}a{color:#7dff8a}</style></head><body><div id=app></div><script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');let tok=localStorage.chaskaRider||'',S=null,es,ends={},last='',audio=null,gps=null,lastGps=0;
async function api(m,p,b){let r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json',...(tok?{Authorization:'Bearer '+tok}:{})},body:b===undefined?undefined:JSON.stringify(b)}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Error');return j}
function toast(x){let d=document.createElement('div');d.className='toast';d.textContent=x;document.body.append(d);setTimeout(()=>d.remove(),2800)}
function beep(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();[880,1175,880].forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.18;o.connect(g);g.connect(audio.destination);o.start(audio.currentTime+i*.2);o.stop(audio.currentTime+i*.2+.15)});navigator.vibrate?.([400,150,400])}catch(e){}}
function login(){app.innerHTML=`<div class=login><div class=card><div style="font-size:55px">🛵</div><h2>Chaska Delivery Partner</h2>${login.o?'<input id=otp class=big maxlength=4 placeholder=OTP><button class="btn g" onclick=verify()>Verify & Login</button>':'<input id=ph maxlength=10 inputmode=numeric placeholder="Registered mobile"><button class="btn g" onclick=send()>Get OTP</button>'}</div></div>`}login.o=false;
async function send(){login.ph=$('#ph').value.trim();try{await api('POST','/auth/otp',{phone:login.ph,role:'rider'});login.o=true;login()}catch(e){alert(e.message)}}
async function verify(){try{beep();tok=(await api('POST','/auth/verify',{phone:login.ph,role:'rider',otp:$('#otp').value})).token;localStorage.chaskaRider=tok;start()}catch(e){alert(e.message)}}
function logout(){tok='';S=null;localStorage.removeItem('chaskaRider');es?.close();stopGps();login()}
async function load(){try{S=await api('GET','/rider/state');for(let o of S.offers||[])if(!ends[o.id])ends[o.id]=Date.now()+o.left*1000;let n=(S.offers||[]).find(o=>o.id!==last&&ends[o.id]>Date.now());if(n){last=n.id;beep()}if(!S.offers?.length)last='';S.me.online?startGps():stopGps();render()}catch(e){if(e.message.includes('Login'))logout()}}
function start(){load();es?.close();es=new EventSource('/api/stream?token='+encodeURIComponent(tok));es.onmessage=load}
async function online(){try{beep();await api('POST','/rider/online',{online:!S.me.online});load()}catch(e){toast(e.message)}}
function startGps(){if(gps!==null||!navigator.geolocation)return;gps=navigator.geolocation.watchPosition(p=>{let t=Date.now();if(t-lastGps>5000){lastGps=t;api('POST','/rider/location',{lat:p.coords.latitude,lng:p.coords.longitude}).catch(()=>{});lastGps=t}},()=>toast('GPS permission allow karein'),{enableHighAccuracy:true})}
function stopGps(){if(gps!==null)navigator.geolocation.clearWatch(gps);gps=null}
async function act(k,id){try{await api('POST',`/rider/${k}/${id}`);toast(k==='accept'?'✅ Order accept ho gaya':'✅ Done');load()}catch(e){toast(e.message)}}
function map(r,d){if(!r||!d)return'';return `<div class=map><svg viewBox="0 0 400 150"><line x1=30 y1=120 x2=370 y2=30 stroke="#ffd75e" stroke-width=5 stroke-dasharray="9 7"/><text x=20 y=120 font-size=28>🏪</text><text x=355 y=32 font-size=28>🏠</text></svg></div>`}
function offer(o){return `<div class=sheet><div><b style="font-size:20px">🔔 NEW ORDER</b> <span class=tag>${Math.max(0,Math.ceil((ends[o.id]-Date.now())/1000))}s</span><div style="font-size:38px;color:#7dff8a;font-weight:900">₹${o.earn}</div>${map(S.restaurant,o.dest)}<p>🏪 Restaurant: ${o.d_rest??'—'} km · 🏠 Customer: ${o.d_cust??'—'} km</p><p>👤 ${E(o.name)}<br>🏠 ${E(o.addr)}<br>💵 Collect ₹${o.total} (${E(o.pay)})</p><div class=sw data-k=accept data-id="${o.id}"><b>›</b>Swipe to Accept</div><p style="text-align:center"><a onclick="api('POST','/rider/decline/${o.id}').then(load)">Decline</a></p></div></div>`}
function active(o){let k=o.status==2?'pickup':o.status==3?'deliver':'';return `<div class=box><span class=tag>${E(o.id)}</span> <b>${o.status<2?'Accepted – preparing':' '+(o.status==2?'Pickup karein':'Customer ko deliver karein')}</b>${map(S.restaurant,o.dest)}<p>👤 ${E(o.name)} · <a href="tel:${E(o.phone)}">📞 Call</a><br>🏠 ${E(o.addr)}<br>💵 ₹${o.total} (${E(o.pay)})</p>${o.items.map(i=>E(i.n)+'×'+i.q).join(', ')}<br><br>${k?`<div class=sw data-k=${k} data-id="${o.id}"><b>›</b>Swipe: ${k==='pickup'?'Picked Up':'Delivered'}</div>`:'Wait for next status…'}</div>`}
function render(){if(!tok||!S)return login();let o=S.me.online&&!S.active?(S.offers||[]).find(x=>ends[x.id]>Date.now()):null;app.innerHTML=`<div class=app><div class=top><div style="font-size:35px">🛵</div><div class=grow><b>${E(S.me.name)}</b><br>${S.me.online?'🟢 Online':'⚫ Offline'}</div><div class="tg ${S.me.online?'on':''}" onclick=online()><i></i></div><a onclick=logout style="color:#aaa">Logout</a></div><div class=box>Deliveries: <b>${S.history.length}</b> · Earnings: <b>₹${S.earnings}</b></div>${S.active?active(S.active):S.me.online?'<div class=box style="text-align:center;padding:30px">🛵<h3>Naye order ka wait…</h3>Order aate hi popup + sound/vibration.</div>':'<div class=box>⚫ Offline — Online toggle ON karein.</div>'}<h3>📜 History</h3><div class=box>${S.history.map(x=>`${x.id} · ₹${x.total} · +₹${x.earn}<br>`).join('')||'No delivery yet'}</div></div>${o?offer(o):''}`}
document.addEventListener('pointerdown',e=>{let h=e.target.closest('.sw b');if(!h)return;let w=h.parentNode,max=w.clientWidth-58,x0=e.clientX;h.setPointerCapture(e.pointerId);let mv=x=>h.style.left=Math.max(4,Math.min(max+4,4+x.clientX-x0))+'px',up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);let x=parseFloat(h.style.left)||4;h.style.left='4px';if(x>max*.8)act(w.dataset.k,w.dataset.id)};h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up)});
setInterval(()=>{Object.keys(ends).forEach(k=>ends[k]<Date.now()&&delete ends[k]);load()},4000);tok?start():login();
</script></body></html>
