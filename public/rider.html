<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><title>Chaska Delivery Partner</title><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="stylesheet" href="/common.css"><link rel="manifest" href="/rider.webmanifest"><meta name="theme-color" content="#111111"><link rel="apple-touch-icon" href="/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<style>body{background:#111;color:#f5f5f5}.rapp{min-height:100vh;padding:14px;max-width:480px;margin:auto}.rapp .box,.rapp .kp>div{background:#1e1e1e;border-color:#333}.rt{display:flex;align-items:center;gap:10px}
.tg{width:52px;height:28px;border-radius:14px;background:#555;position:relative;cursor:pointer}.tg i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}.tg.on{background:#2e7d32}.tg.on i{left:27px}
a{color:#7dff8a}</style></head><body><div id="app"></div>
<script src="/common.js"></script>
<script>
let tok=localStorage.getItem('ck_rider')||'',lg={p:'',s:0,demo:''},S=null,last='',drag=0,sk=[],myPos=null,watch=null,lastPost=0,ringT=null,ac=null,es=null,dl={},OFFER=30,shown='',inst=null;
addEventListener('pointerdown',()=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(x){}});
function beep(){if(!ac)return;[880,1175].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='square';g.gain.value=.18;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+i*.22);o.stop(ac.currentTime+i*.22+.2)})}
function ring(on){if(on&&!ringT){const f=()=>{beep();try{navigator.vibrate&&navigator.vibrate([400,150,400,150,400])}catch(x){}};f();ringT=setInterval(f,2200)}if(!on&&ringT){clearInterval(ringT);ringT=null;try{navigator.vibrate&&navigator.vibrate(0)}catch(x){}}}
function LGN(){return`<div class="lgn"><div class="lc"><div style="font-size:54px">🛵</div><h2>Chaska Delivery Partner</h2><p>${lg.s?'4-digit OTP daalein (+91 '+esc(lg.p)+')':'Apna registered mobile number daalein'}</p>${lg.s?`<input id="lo" class="big" maxlength="4" inputmode="numeric" placeholder="••••"><button class="btn g" style="width:100%" onclick="VO()">Verify &amp; Login</button>${lg.demo?`<p><small>Demo OTP: ${esc(lg.demo)}</small></p>`:''}<a onclick="lg.s=0;R()">Number badlein</a>`:`<div class="ph"><span>+91</span><input id="lp" class="big" maxlength="10" inputmode="numeric" placeholder="10-digit number" value="${esc(lg.p)}" oninput="lg.p=this.value"></div><button class="btn g" style="width:100%" onclick="GO()">Get OTP</button>`}</div></div>`}
async function GO(){try{const r=await api('POST','/auth/otp',{phone:lg.p.trim(),role:'rider'});lg.p=lg.p.trim();lg.s=1;lg.demo=r.demo_otp||'';R()}catch(e){alert(e.message)}}
async function VO(){try{const r=await api('POST','/auth/verify',{phone:lg.p,role:'rider',otp:$('#lo').value});tok=r.token;localStorage.setItem('ck_rider',tok);lg={p:'',s:0,demo:''};start()}catch(e){alert(e.message)}}
function LO(){ring(false);tok='';S=null;localStorage.removeItem('ck_rider');if(es)es.close();stopGps();R()}
async function load(){if(!tok)return;try{S=await api('GET','/rider/state',null,tok)}catch(e){if(e.status==401)return LO();return}for(const o of S.offers){const d=Date.now()+o.left*1000;if(!dl[o.id]||Math.abs(dl[o.id]-d)>2500)dl[o.id]=d}gps();const j=JSON.stringify(S,(k,v)=>k=='left'?undefined:v);if(j!==last&&!drag){last=j;R()}}
function start(){api('GET','/push/key').then(k=>OFFER=k.offer_seconds).catch(()=>{});pushOn(false);load();if(es)es.close();es=new EventSource('/api/stream?token='+encodeURIComponent(tok));es.onmessage=()=>load()}
function gps(){if(!S||!S.me.online){stopGps();return}if(watch!==null||!navigator.geolocation)return;watch=navigator.geolocation.watchPosition(p=>{myPos={lat:p.coords.latitude,lng:p.coords.longitude};const t=Date.now();if(t-lastPost>6000){lastPost=t;api('POST','/rider/location',myPos,tok).then(()=>{}).catch(()=>{})}},()=>toast('Location allow karein – customer ko live map ke liye zaroori'),{enableHighAccuracy:true})}
function stopGps(){if(watch!==null&&navigator.geolocation)navigator.geolocation.clearWatch(watch);watch=null}
async function TG(){if(!S.me.online)pushOn(true);try{await api('POST','/rider/online',{online:!S.me.online},tok);await load()}catch(e){toast(e.message)}}
const SK=id=>{sk.push(id);api('POST','/rider/decline/'+id,null,tok).catch(()=>{});R()};
async function act(path,id){try{await api('POST',`/rider/${path}/${id}`,null,tok);toast(path=='accept'?'✅ Order aapka hua!':'✅ Done')}catch(e){toast(e.message)}last='';load()}
const b2u=b=>{const s=(b+'='.repeat((4-b.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'),x=atob(s);return Uint8Array.from([...x].map(c=>c.charCodeAt(0)))};
async function pushOn(ask){try{if(!('serviceWorker' in navigator)||!('PushManager' in window)||typeof Notification=='undefined')return;const reg=await navigator.serviceWorker.register('/sw.js');await navigator.serviceWorker.ready;if(Notification.permission=='default'&&ask)await Notification.requestPermission();if(Notification.permission!='granted'){R();return}const k=(await api('GET','/push/key')).key;let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b2u(k)});await api('POST','/rider/push',sub.toJSON(),tok);R()}catch(e){console.warn('push',e)}}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();inst=e;R()});
const INS=()=>{inst&&inst.prompt();inst=null;R()},standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone,ios=()=>/iphone|ipad/i.test(navigator.userAgent);
function tick(){const c=$('#cd');if(!c)return;const d=dl[c.dataset.id]-Date.now();if(d<=0){R();load();return}c.textContent=Math.ceil(d/1000)+'s';$('#cbar').style.width=Math.max(0,d/(OFFER*1000)*100)+'%';c.style.color=d<8000?'#ff6b6b':'#ffd75e'}
setInterval(tick,250);
const SW={AC:id=>act('accept',id),PK:id=>act('pickup',id),DL:id=>act('deliver',id)};
const km_=v=>v==null?'—':v+' km',sw=(a,i,t)=>`<div class="sw" data-a="${a}" data-i="${i}"><b>›</b><span>${t}</span></div>`,pay=o=>esc(o.pay=='UPI'?'UPI':'Cash');
function offer(o,fresh){return`<div class="sheet"><div ${fresh?'':'style="animation:none"'}><div style="display:flex;justify-content:space-between;align-items:center"><b><span style="display:inline-block;animation:ring .6s infinite">🔔</span> New delivery request</b><span class="tag">${o.items.reduce((a,i)=>a+i.q,0)} items</span></div><div style="display:flex;align-items:center;gap:10px;margin:6px 0"><div id="cd" data-id="${o.id}" style="font-size:30px;font-weight:800;color:#ffd75e;min-width:64px">${Math.max(0,Math.ceil((dl[o.id]-Date.now())/1000))}s</div><div style="flex:1;height:8px;background:#333;border-radius:4px;overflow:hidden"><div id="cbar" style="height:100%;background:#ffd75e;width:${Math.max(0,(dl[o.id]-Date.now())/(OFFER*10))}%"></div></div></div><div style="font-size:38px;font-weight:800;color:#7dff8a">₹${o.earn}</div><small>Restaurant tak ${km_(o.d_rest)} · Customer tak ${km_(o.d_cust)}</small>${o.dest?mapSvg(S.restaurant,o.dest,myPos,1):'<div class="box">🗺️ Customer ne live location nahi di – address dekhein</div>'}<div>🏠 ${esc(o.addr.slice(0,90))}</div><div>💵 Collect ₹${o.total} (${pay(o)})</div><br>${sw('AC',o.id,'Swipe to accept')}<p style="text-align:center"><a style="color:#aaa;cursor:pointer" onclick="SK('${o.id}')">Decline</a></p></div></div>`}
function active(o){const nav=o.status==3?(o.dest?`${o.dest.lat},${o.dest.lng}`:encodeURIComponent(o.addr)):`${S.restaurant.lat},${S.restaurant.lng}`;return`<div class="box"><span class="tag">${o.id}</span> <b>${o.status<2?'Restaurant ki taraf jaiye':o.status==2?'Order pickup karein':'Customer ko deliver karein'}</b><br><small>Restaurant ${km_(o.d_rest)} · Customer ${km_(o.d_cust)} · ₹${o.earn} earning</small>${mapSvg(S.restaurant,o.dest,myPos,1)}<div>👤 ${esc(o.name)} · <a href="tel:${esc(o.phone)}">📞 Call</a></div><div>🏠 ${esc(o.addr)}</div><div>💵 Collect ₹${o.total} (${pay(o)})</div><div>${o.items.map(i=>esc(i.n)+'×'+i.q).join(', ')}</div><a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${nav}">🧭 Navigate</a><br><br>${o.status<2?'<small>Restaurant order prepare karega, thoda wait…</small>':o.status==2?sw('PK',o.id,'Swipe: Picked up'):sw('DL',o.id,'Swipe: Delivered')}</div>`}
function R(){const a=$('#app');if(tok&&!S){a.innerHTML='<div class="rapp">Loading…</div>';return}if(!tok||!S){ring(false);a.innerHTML=LGN();return}const p=S.me,of=p.online&&!S.active?S.offers.find(o=>!sk.includes(o.id)&&dl[o.id]>Date.now()):null,fresh=!!of&&shown!=of.id;shown=of?of.id:'';ring(!!of);
a.innerHTML=`<div class="rapp"><div class="rt"><div style="font-size:34px">🛵</div><div style="flex:1"><b>${esc(p.name)}</b><br><small>${p.online?'🟢 Online':'⚫ Offline'}</small></div><div class="tg ${p.online?'on':''}" onclick="TG()"><i></i></div><a onclick="LO()" style="color:#aaa;cursor:pointer;font-size:13px">Logout</a></div>
${!standalone()&&(inst||ios())?`<div class="box" style="display:flex;gap:10px;align-items:center"><span style="flex:1;font-size:13px">📲 App install karein – phone ke upar notification + sound ke liye</span>${inst?'<button class="btn g" onclick="INS()">Install</button>':'<small>Share → Add to Home Screen</small>'}</div>`:''}${typeof Notification!='undefined'&&Notification.permission=='default'?'<div class="box" style="display:flex;gap:10px;align-items:center"><span style="flex:1;font-size:13px">🔔 Band app me bhi order alert paane ke liye</span><button class="btn g" onclick="pushOn(true)">Allow</button></div>':''}<div class="kp" style="margin:12px 0"><div><small>Deliveries</small><b>${S.history.length}</b></div><div><small>Earnings</small><b>₹${S.earnings}</b></div></div>
${S.active?active(S.active):!p.online?'<div class="box">⚫ Aap offline hain. Orders paane ke liye upar toggle se Online ho jaiye.</div>':'<div class="box" style="text-align:center"><div style="position:relative;height:90px"><div style="position:absolute;left:50%;top:50%;width:80px;height:80px;margin:-40px;border-radius:50%;background:#2e7d32;animation:pl 2s infinite"></div><div style="position:absolute;left:50%;top:50%;font-size:30px;transform:translate(-50%,-50%)">🛵</div></div>Nayi orders ka intezaar… (sound + vibration ke saath pop-up aayega)</div>'}
<h3>History</h3><div class="box"><table>${S.history.map(o=>`<tr><td>${o.id}</td><td>${new Date(o.done_at).toLocaleDateString()}</td><td>₹${o.total}</td><td style="color:#7dff8a">+₹${o.earn}</td></tr>`).join('')||'<tr><td>Abhi koi delivery nahi</td></tr>'}</table></div></div>${of?offer(of,fresh):''}`}
document.addEventListener('pointerdown',ev=>{const h=ev.target.closest('.sw b');if(!h)return;const w=h.parentNode,mx=w.clientWidth-h.offsetWidth-8,x0=ev.clientX;drag=1;h.setPointerCapture(ev.pointerId);const mv=m=>{h.style.left=Math.max(4,Math.min(mx+4,4+m.clientX-x0))+'px'},up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);drag=0;if(parseFloat(h.style.left)>mx*.8){h.style.left=mx+4+'px';try{navigator.vibrate&&navigator.vibrate(60)}catch(x){}SW[w.dataset.a](w.dataset.i)}else h.style.left='4px'};h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up)});
setInterval(load,4000);tok?start():R();
</script></body></html>
